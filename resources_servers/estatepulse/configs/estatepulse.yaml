estatepulse:
  resources_servers:
    estatepulse:
      entrypoint: app.py
      domain: agent
      verified: false
      description: EstatePulse AI - 10 real-estate metric agents (8 eval harnesses + eval/RL for forecast and deal)
estatepulse_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: estatepulse
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/estatepulse/data/example.jsonl
      - name: eval_metrics
        type: validation
        jsonl_fpath: resources_servers/estatepulse/data/eval_metrics.jsonl
        license: Apache 2.0
      - name: rl_forecast_deal
        type: train
        jsonl_fpath: resources_servers/estatepulse/data/rl_forecast_deal.jsonl
        license: Apache 2.0

estatepulse_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: estatepulse_simple_agent
