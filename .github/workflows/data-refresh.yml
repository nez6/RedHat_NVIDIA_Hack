name: Live data refresh

# CD for data: pull FRED + live police feeds, validate contracts, run tests against the new
# snapshot, and commit it only if everything passes. The app hot-reloads data/live/*.json.
on:
  schedule:
    - cron: "17 10 * * *"   # daily, 06:17 America/New_York (EDT)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Live source smoke tests
        run: pytest -m live -q
      - name: Ingest (strict)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m pipeline.run --strict
      - name: Regression tests
        run: pytest
      - name: Commit snapshot if changed
        run: |
          git config user.name "dreamhome-bot"
          git config user.email "dreamhome-bot@users.noreply.github.com"
          git add data/live
          git diff --cached --quiet && echo "no data change" && exit 0
          git commit -m "data: live refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
