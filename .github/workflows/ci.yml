name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit + contract + API tests (hermetic, no GPU/network)
        run: pytest --junitxml=reports/junit.xml
      - name: Validate committed live snapshots
        run: |
          python - <<'PY'
          import json, os
          from pipeline import validate
          d = "data/live"
          if os.path.exists(f"{d}/fred.json"):
              validate.check_fred(json.load(open(f"{d}/fred.json"))["series"], max_age_days=3650)
          if os.path.exists(f"{d}/safety.json"):
              hoods = [h["name"] for h in json.load(open("data/neighborhoods.json"))]
              validate.check_safety(json.load(open(f"{d}/safety.json"))["neighborhoods"], hoods)
          print("snapshots OK")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.python }}
          path: reports/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Tests inside the image
        run: docker build --target test -t estatepulse-test .
      - name: Build runtime image
        run: docker build -t estatepulse-app .
      - name: Smoke test the container (Nemotron offline -> fallbacks)
        run: |
          docker run -d --name ep -p 8501:8501 -e NEMOTRON_BASE_URL=http://127.0.0.1:9/v1 -e NEMOTRON_MAX_RETRIES=0 estatepulse-app
          for i in $(seq 1 30); do curl -sf localhost:8501/api/meta && break; sleep 1; done
          curl -sf localhost:8501/api/agents | python -c "import json,sys; d=json.load(sys.stdin); assert d['problems']==[] and len(d['agents'])==6"
          test "$(docker inspect -f '{{.State.Health.Status}}' ep)" != "unhealthy"
      - name: Validate compose file
        run: docker compose --profile gpu --profile jobs config -q
