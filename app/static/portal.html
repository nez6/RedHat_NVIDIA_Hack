<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>My Home Match Portal · EstatePulse AI</title>
<link rel="stylesheet" href="static/site.css">
<style>
.wrap{max-width:820px}
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
@media (max-width:620px){.status{grid-template-columns:1fr}}
.s{border:1px solid var(--line);border-radius:10px;padding:12px}.s .l{font-size:12px;color:var(--muted)}.s .v{font-weight:700;margin-top:2px}
.s.ok .v{color:var(--accent-ink)}
.w{display:grid;grid-template-columns:150px 1fr 26px;gap:10px;align-items:center;font-size:13px;margin:5px 0}
</style>
</head>
<body>
<script src="static/nav.js"></script>
<div class="wrap">
  <div id="out" class="card"><p class="muted">Checking your sign-in link…</p></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const token = new URLSearchParams(location.search).get("token") || (()=>{try{return sessionStorage.getItem("portal_token")}catch(_){return null}})();
(async () => {
  if (!token) { $("out").innerHTML = '<h1>Sign in</h1><p class="lede">Open the link from your Home Match email, or <a href="start">start the Home Match Toolkit</a>.</p>'; return; }
  const r = await fetch("api/portal?token=" + encodeURIComponent(token));
  if (!r.ok) { $("out").innerHTML = '<h1>This link has expired</h1><p class="lede">Ask your advisor for a new one, or <a href="start">start again</a>.</p>'; return; }
  try { sessionStorage.setItem("portal_token", token); } catch (_) {}
  history.replaceState(null, "", "portal");  // keep the token out of the address bar and history
  const d = await r.json(), p = d.profile, labels = await fetch("api/agents").then(r => r.json()).then(a => Object.fromEntries(a.metrics.map(m => [m.key, m.label]))).catch(() => ({}));
  $("out").innerHTML = `<h1>Welcome back, ${esc(d.name.split(" ")[0])}</h1>
    <p class="lede">${esc(p.summary)}</p>
    <div class="status">
      <div class="s ${d.showings_unlocked?"ok":""}"><div class="l">Showings</div><div class="v">${d.showings_unlocked?"Unlocked":"Locked until we receive your document"}</div></div>
      <div class="s ${d.kickoff_completed?"ok":""}"><div class="l">Kickoff meeting</div><div class="v">${d.kickoff_completed?"Done":"Not yet"}</div></div>
      <div class="s"><div class="l">Financing</div><div class="v">${esc(d.financing)}</div></div>
    </div>
    <h2>How we weigh homes for you</h2>
    ${Object.entries(p.weights).map(([k,v]) => `<div class="w"><span>${esc(labels[k]||k)}</span><div class="bar"><i style="width:${v*20}%"></i></div><b class="mono">${v}</b></div>`).join("")}
    <a class="btn" href="./?token=${encodeURIComponent(token)}">See my matched homes →</a>`;
})();
</script>
</body>
</html>
